<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Transparent background, crisp rendering -->
  <g id="tiga-serangkai-exact-logo">
    <!-- Teal Book Shield -->
    <path
      d="M 26 26
         L 100 52
         L 174 26
         L 174 160
         L 100 186
         L 26 160
         Z"
      fill="#006A70"
      stroke="#006A70"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Left Page: Bold White "T" -->
    <!-- Top-left: (30, 32), top-right along crease: (96, 55), down to (96, 80), left to (74, 72), down to (74, 174), left to (46, 164), up to (46, 62), left to (30, 56) -->
    <path
      d="M 30 32
         L 96 55
         L 96 82
         L 75 74
         L 75 174
         L 46 164
         L 46 63
         L 30 57
         Z"
      fill="#FFFFFF"
    />

    <!-- Right Page: Fluid White "S" (Road / River motif) -->
    <!--
      Left edge: from (104, 58) curves out to (132, 85) -> curves down-left to (108, 128) -> down to (104, 184)
      Bottom / right edge: from (104, 184) along bottom to (138, 172) -> curves up-right to (168, 146) -> curves up-left to (136, 102) -> curves up-right to (164, 30) -> top-left to (104, 58)
    -->
    <path
      d="M 104 58
         C 134 84, 134 100, 114 126
         C 104 140, 103 162, 104 184
         C 130 175, 156 160, 168 144
         C 172 120, 144 104, 136 86
         C 130 70, 148 44, 165 30
         L 104 58
         Z"
      fill="#FFFFFF"
    />
  </g>
</svg>